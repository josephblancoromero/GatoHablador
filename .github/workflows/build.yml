name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build GatoHablador.sln -c Release
      - name: Core tests
        run: dotnet run --project tests/GatoHablador.Core.Tests -c Release --no-build
      - name: Publish Windows app
        run: dotnet publish src/GatoHablador.Desktop/GatoHablador.Desktop.csproj -c Release --no-build -o publish/app
      - name: Bundle addon and documentation
        shell: pwsh
        run: |
          Copy-Item addon/GatoHablador publish/addon/GatoHablador -Recurse
          Copy-Item README.md, LICENSE, PRIVACY.md, SECURITY.md publish/
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: GatoHablador-windows-${{ github.sha }}
          path: publish
          if-no-files-found: error
          retention-days: 14

